
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeakPro | Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f6fc;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.login-box {
    background: white;
    width: 360px;
    padding: 35px;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.1);
}

h1 {
    color: #1557a5;
    text-align: center;
    margin-bottom: 10px;
}

p {
    text-align: center;
    color: #68788a;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 7px;
    color: #24364b;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccd9e8;
    border-radius: 7px;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 22px;
    background: #1557a5;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 16px;
}

a {
    color: #1557a5;
    text-decoration: none;
}

.back {
    display: block;
    text-align: center;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>SpeakPro</h1>
    <p>Welcome back! Please login.</p>

    <form>
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>

        <button type="submit">Login</button>
    </form>

    <p style="margin-top:20px;">
        Don't have an account?
        <a href="/register/">Register</a>
    </p>

    <a class="back" href="/">Back to Home</a>

</div>

</body>
</html>
